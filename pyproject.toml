[project]
name = "colombian-case-methane-analysis"
version = "0.1.0"
description = "Herramientas para recolectar, analizar y visualizar metano atmosférico en Colombia."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cartopy>=0.24",
    "contextily>=1.6",
    "earthengine-api>=1.5",
    "geopandas>=1.0",
    "gstools>=1.6",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
    "shapely>=2.0",
    "xyzservices>=2024.9.0",
]

[dependency-groups]
notebooks = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "lckr-jupyterlab-variableinspector>=3.2",
]
analysis = [
    "deep-translator>=1.11",
    "kneed>=0.8",
    "pingouin>=0.5",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "torch>=2.5",
    "linearmodels>=0.5",
]
surface = [
    "basemap>=1.4",
    "pygrib>=2.1",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
